name: Collect seven-day production usage

on:
  schedule:
    # Cloudflare runs at 08:00 KST. This 08:17 KST schedule is a delayed backup.
    - cron: "17 23 * * *"
  repository_dispatch:
    types:
      - lfp-production-collect
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lfp-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LFP_API_BASE_URL: ${{ vars.LFP_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A queued repository_dispatch run must start after any earlier
          # collection commit, not from the commit captured when dispatched.
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whether scheduled production data is already current
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("web/data/lidding-production-usage.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          yesterday = (datetime.now(ZoneInfo("Asia/Seoul")).date() - timedelta(days=1)).isoformat()
          print(f"collect={'true' if payload.get('dateTo') != yesterday else 'false'}")
          PY

      - name: Collect process 55 production usage through yesterday
        if: steps.freshness.outputs.collect == 'true'
        run: python scripts/collect_git_data.py --scope production

      - name: Commit changed dashboard data
        shell: bash
        run: |
          git add web/data
          if git diff --cached --quiet; then
            echo "No production usage change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh seven-day production usage"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the latest main branch."
            git pull --rebase origin main
          done
          exit 1
