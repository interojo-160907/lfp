name: Collect seven-day production usage

on:
  schedule:
    # GitHub cron is UTC. 23:00 UTC = 08:00 Asia/Seoul on the next day.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lfp-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LFP_API_BASE_URL: ${{ vars.LFP_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect process 55 production usage through yesterday
        run: python scripts/collect_git_data.py --scope production

      - name: Commit changed dashboard data
        shell: bash
        run: |
          git add web/data
          if git diff --cached --quiet; then
            echo "No production usage change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh seven-day production usage"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the latest main branch."
            git pull --rebase origin main
          done
          exit 1
