name: Collect dashboard data

on:
  schedule:
    # Cloudflare is the primary one-minute monitor. This is a twice-hourly backup.
    - cron: "17,47 * * * *"
  repository_dispatch:
    types:
      - lfp-auto-collect
      - lfp-manual-collect
  workflow_dispatch:
    inputs:
      scope:
        description: Collection scope
        required: true
        default: all
        type: choice
        options:
          - all
          - aps
          - inventory
          - purchase
          - bom
          - production

permissions:
  contents: write

concurrency:
  group: lfp-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LFP_API_BASE_URL: ${{ vars.LFP_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select collection scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_SCOPE: ${{ inputs.scope }}
          CLIENT_SCOPE: ${{ github.event.client_payload.scope }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ "$EVENT_ACTION" = "lfp-manual-collect" ]; then
            case "$CLIENT_SCOPE" in
              all|aps|inventory|purchase|bom|production)
                echo "COLLECTION_SCOPE=$CLIENT_SCOPE" >> "$GITHUB_ENV"
                ;;
              *)
                echo "Unsupported manual collection scope: $CLIENT_SCOPE" >&2
                exit 1
                ;;
            esac
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "COLLECTION_SCOPE=auto" >> "$GITHUB_ENV"
          else
            echo "COLLECTION_SCOPE=$INPUT_SCOPE" >> "$GITHUB_ENV"
          fi

      - name: Collect latest API data
        run: python scripts/collect_git_data.py --scope "$COLLECTION_SCOPE"

      - name: Commit changed dashboard data
        shell: bash
        run: |
          git add web/data
          if git diff --cached --quiet; then
            echo "No source change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh ${COLLECTION_SCOPE}"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the latest main branch."
            git pull --rebase origin main
          done
          exit 1

      - name: Reset completed delivery schedules
        shell: bash
        run: curl --fail --silent --show-error "https://lfp-schedule-relay.hwh2404.workers.dev/data?source=collection"

