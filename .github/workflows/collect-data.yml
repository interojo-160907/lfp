name: Collect dashboard data

on:
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
    inputs:
      scope:
        description: Collection scope
        required: true
        default: all
        type: choice
        options:
          - all
          - aps
          - inventory
          - purchase
          - bom

permissions:
  contents: write

concurrency:
  group: lfp-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LFP_API_BASE_URL: ${{ vars.LFP_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select collection scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "COLLECTION_SCOPE=aps-watch" >> "$GITHUB_ENV"
          else
            echo "COLLECTION_SCOPE=${{ inputs.scope }}" >> "$GITHUB_ENV"
          fi

      - name: Collect latest API data
        run: python scripts/collect_git_data.py --scope "$COLLECTION_SCOPE"

      - name: Commit changed dashboard data
        shell: bash
        run: |
          git add web/data
          if git diff --cached --quiet; then
            echo "No source change detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh ${COLLECTION_SCOPE}"
          git push
